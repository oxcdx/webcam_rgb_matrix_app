<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tracing Together</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body data-bs-theme="dark">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <div class="ps-2">
                <h1 class="navbar-brand">Tracing Together</h1>
            </div>
            <div class="text-end">
                <div class="btn-group">
                    <button id="scanner-mode-btn" class="btn btn-info">Scanner Mode: Off</button>
                    <button id="show-modal-btn" class="btn btn-secondary">Show Editor</button>
                    <button id="capture-btn" class="btn btn-danger">Capture Image</button>
                </div>
            </div> 
        </div>
    </nav>
    <main class="container-fluid">
        <!-- Scanner Mode Controls -->
        <div id="scanner-controls" class="row mb-4" style="display: none;">
            <div class="col-12 text-center">
                <div class="card bg-transparent border-0 text-white">
                    <div class="card-body p-0">
                        <h5 class="card-title visually-hidden">Scanner Mode</h5>
                        <div class="d-flex justify-content-end gap-3">
                            <button id="upload-btn" class="btn btn-primary">Upload | Auto Crop</button>
                            <button id="manual-upload-btn" class="btn btn-primary">Upload | Manual</button>
                            <input type="file" id="file-input" accept="image/*" style="display: none;">    
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 d-flex justify-content-center">
                <div class="square-crop mb-3">
                    <img id="webcam" src="{{ url_for('video_feed') }}" alt="Webcam Feed" class="img-fluid h-100 w-100">
                </div>
                <p class="text-center visually-hidden">Original Feed</p>
            </div>
            <div class="col-md-6 d-flex justify-content-center">
                <div class="square-crop mb-3">
                    <img id="webcam-mosaic" src="{{ url_for('video_feed_mosaic') }}" alt="Mosaic Feed" class="img-fluid h-100 w-100">
                </div>
                <p class="text-center visually-hidden">Mosaic Feed (32x32 tiles)</p>
            </div>          
        </div> 
    </main>
    <!-- Modal for third video feed -->
    <div class="modal fade" id="effectModal" tabindex="-1" aria-labelledby="effectModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="effectModalLabel">Mosaic + Effects</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center">
                <div class="square-crop mb-3 w-100">
                  <img id="captured-mosaic" src="{{ url_for('static', filename='img/placeholder.jpg') }}" alt="Captured Mosaic" class="img-fluid rounded border">
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <div class="mb-2">
                    <label for="brightness" class="form-label">Brightness</label>
                    <input type="range" class="form-range" min="0.5" max="2.0" step="0.01" id="brightness" value="1.0">
                </div>
                <div class="mb-2">
                    <label for="contrast" class="form-label">Contrast</label>
                    <input type="range" class="form-range" min="0.5" max="2.0" step="0.01" id="contrast" value="1.0">
                </div>
                <div class="mb-2">
                    <label for="saturation" class="form-label">Saturation</label>
                    <input type="range" class="form-range" min="0.0" max="2.0" step="0.01" id="saturation" value="1.0">
                </div>
                <div class="mb-2">
                    <label for="highlights" class="form-label">Highlights</label>
                    <input type="range" class="form-range" min="0.0" max="1.5" step="0.01" id="highlights" value="0.0">
                </div>
                <div class="mb-2">
                    <button id="invert-btn" class="btn btn-outline-light w-100 mb-2">Invert: Off</button>
                </div>
                <div class="mb-2">
                    <label for="hue-shift" class="form-label">Hue Shift</label>
                    <input type="range" class="form-range" min="0" max="179" step="1" id="hue-shift" value="0">
                </div>
                <div class="mb-2">
                    <button id="colorize-btn" class="btn btn-warning w-100 mb-2">Colorize: Off</button>
                </div>
                <div class="mb-2">
                    <button id="save-final-btn" class="btn btn-primary w-100">Save Final Image</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const DEFAULT_EFFECT_STATE = {
            brightness: "1.0",
            contrast: "1.0",
            saturation: "1.0",
            highlights: "0.0",
            hue_shift: "0",
            colorize: 0,
            invert: 0
        };

        let scannerMode = false;
        let scannerFilename = null;
        let lastCapture = null;
        let colorize = false;
        let invert = false;
        let scannerUploadRequestToken = 0;
        let processedMosaicRequestToken = 0;

        // Initialize scanner mode state
        fetch("/get_scanner_mode")
            .then(res => res.json())
            .then(data => {
                scannerMode = data.scanner_mode;
                scannerFilename = data.scanner_filename;
                updateScannerModeUI();
            });

        // Initialize button states
        function initializeButtons() {
            updateColorizeButton();
            updateInvertButton();
        }

        function getEffectControlState() {
            return {
                brightness: document.getElementById("brightness").value,
                contrast: document.getElementById("contrast").value,
                saturation: document.getElementById("saturation").value,
                highlights: document.getElementById("highlights").value,
                hue_shift: document.getElementById("hue-shift").value,
                colorize,
                invert
            };
        }

        function logEffectControlState(label) {
            // console.log(`[effects] ${label}`, getEffectControlState());
        }

        function resetEffectControls(effectState = DEFAULT_EFFECT_STATE) {
            // console.log("[effects] resetEffectControls before", getEffectControlState(), effectState);
            const brightnessInput = document.getElementById("brightness");
            const contrastInput = document.getElementById("contrast");
            const saturationInput = document.getElementById("saturation");
            const highlightsInput = document.getElementById("highlights");
            const hueShiftInput = document.getElementById("hue-shift");

            brightnessInput.value = effectState.brightness;
            contrastInput.value = effectState.contrast;
            saturationInput.value = effectState.saturation;
            highlightsInput.value = effectState.highlights;
            hueShiftInput.value = effectState.hue_shift;
            colorize = Boolean(effectState.colorize);
            invert = Boolean(effectState.invert);
            updateColorizeButton();
            updateInvertButton();

            [brightnessInput, contrastInput, saturationInput, highlightsInput, hueShiftInput].forEach(input => {
                input.dispatchEvent(new Event("input", { bubbles: true }));
                input.dispatchEvent(new Event("change", { bubbles: true }));
            });

            logEffectControlState("resetEffectControls after");
        }

        function syncDefaultEffectsToCurrentCapture() {
            logEffectControlState("syncDefaultEffectsToCurrentCapture before");
            updateProcessedMosaic();
            sendMatrixEffectParams();
            logEffectControlState("syncDefaultEffectsToCurrentCapture after");
        }

        // Call initialization when DOM is ready
        setTimeout(initializeButtons, 100);

        document.getElementById('effectModal').addEventListener('show.bs.modal', function () {
            // console.log("[effects] modal show -> reset defaults", getEffectControlState(), lastCapture);
            resetEffectControls(DEFAULT_EFFECT_STATE);
            if (lastCapture) {
                updateProcessedMosaic();
                sendMatrixEffectParams();
            }
        });

        function updateScannerModeUI() {
            const btn = document.getElementById('scanner-mode-btn');
            const controls = document.getElementById('scanner-controls');
            
            btn.textContent = "Scanner Mode: " + (scannerMode ? "On" : "Off");
            btn.classList.toggle("btn-info", !scannerMode);
            btn.classList.toggle("btn-success", scannerMode);
            
            if (scannerMode) {
                controls.style.display = 'block';
            } else {
                controls.style.display = 'none';
            }
        }

        // Scanner mode toggle
        document.getElementById('scanner-mode-btn').onclick = function() {
            scannerMode = !scannerMode;
            // console.log("[scanner] toggle clicked", { enabled: scannerMode });
            resetEffectControls(DEFAULT_EFFECT_STATE);
            syncDefaultEffectsToCurrentCapture();
            fetch("/set_scanner_mode", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({enabled: scannerMode})
            })
            .then(res => res.json())
            .then(data => {
                // console.log("[scanner] toggle response", data);
                if (data.success) {
                    updateScannerModeUI();
                    // Update scanner filename when mode changes
                    fetch("/get_scanner_mode")
                        .then(res => res.json())
                        .then(data => {
                            scannerFilename = data.scanner_filename;
                        });
                }
            });
        };

        function openScannerFilePicker(skipAutoCrop) {
            const fileInput = document.getElementById('file-input');
            fileInput.dataset.skipAutoCrop = skipAutoCrop ? '1' : '0';
            fileInput.click();
        }

        // Scanner functionality - upload with optional auto-crop bypass
        document.getElementById('upload-btn').onclick = function() {
            // console.log("[scanner] upload button clicked");
            openScannerFilePicker(false);
        };

        document.getElementById('manual-upload-btn').onclick = function() {
            // console.log("[scanner] manual upload button clicked");
            openScannerFilePicker(true);
        };

        document.getElementById('file-input').onchange = function(event) {
            const file = event.target.files[0];
            if (file) {
                // Prompt for filename like webcam captures
                let filename = prompt("Enter a name for this scanner upload:");
                if (!filename) {
                    // Reset the file input if user cancels
                    event.target.value = '';
                    return;
                }
                
                const formData = new FormData();
                formData.append('image', file);
                formData.append('filename', filename);
                formData.append('skip_auto_crop', event.target.dataset.skipAutoCrop === '1' ? '1' : '0');
                uploadScannerImage(formData);
            }
            event.target.dataset.skipAutoCrop = '0';
        };
        
        function uploadScannerImage(formData) {
            const requestToken = ++scannerUploadRequestToken;
            // console.log("[scanner] upload starting", {
            //     before: getEffectControlState(),
            //     scannerMode,
            //     scannerFilename,
            //     hasLastCapture: Boolean(lastCapture)
            // });
            fetch("/upload_scanner_image", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (requestToken !== scannerUploadRequestToken) {
                    // console.log("[scanner] ignoring stale upload response", data);
                    return;
                }
                // console.log("[scanner] upload response", data);
                if (data.success) {
                    alert("Scanner image uploaded and auto-cropped successfully!");
                    
                    // Store the scanner filename for future captures
                    scannerFilename = data.filename;
                    
                    // Set lastCapture so the editor can work with the scanner image
                    if (data.folder) {
                        lastCapture = {
                            folder: data.folder,
                            filename: data.mosaic_filename || (data.folder + "-mosaic.jpg"),
                            generation: data.generation
                        };
                    }

                    resetEffectControls(DEFAULT_EFFECT_STATE);
                    syncDefaultEffectsToCurrentCapture();
                    logEffectControlState("after upload UI sync");

                    // Refresh the main-page images using the same reliable,
                    // stateless single-image endpoint the modal preview uses
                    // (/processed_mosaic pattern) instead of the persistent
                    // MJPEG stream, which kept showing the previous upload.
                    if (data.folder) {
                        const originalFilename = data.filename + ".jpg";
                        const mosaicFilename = data.mosaic_filename || (data.filename + "_180x180.jpg");
                        document.getElementById('webcam').src =
                            `/scanner_snapshot/${data.folder}/${originalFilename}/original?t=${Date.now()}`;
                        document.getElementById('webcam-mosaic').src =
                            `/scanner_snapshot/${data.folder}/${mosaicFilename}/mosaic?t=${Date.now()}`;
                    }
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(err => {
                alert("Upload failed: " + err);
            });
        }

        const effectModal = new bootstrap.Modal(document.getElementById('effectModal'));

        document.getElementById("show-modal-btn").onclick = function() {
            if (!lastCapture) {
                alert("No image has been captured yet.");
                return;
            }
            // console.log("[effects] show modal", getEffectControlState(), lastCapture);
            fetch("/matrix_edit"); // <--- Add this line
            updateProcessedMosaic();
            effectModal.show();
        };

        document.getElementById("capture-btn").onclick = function() {
            let base;
            
            // In scanner mode with a filename, use that filename without prompting
            if (scannerMode && scannerFilename) {
                base = scannerFilename;
            } else {
                // Otherwise, prompt for a name
                base = prompt("Enter a name for this capture:");
                if (!base) return;
            }
            
            fetch("/capture_image", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({base})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    lastCapture = {
                        folder: data.folder,
                        filename: data.folder + "-mosaic.jpg",
                        generation: data.generation
                    };
                    resetEffectControls(DEFAULT_EFFECT_STATE);
                    syncDefaultEffectsToCurrentCapture();
                    updateProcessedMosaic();
                    fetch("/matrix_edit");
                    effectModal.show();
                } else {
                    alert("Error: " + data.error);
                }
            });
        };

        function getSliderValues() {
            return {
                brightness: document.getElementById("brightness").value,
                contrast: document.getElementById("contrast").value,
                saturation: document.getElementById("saturation").value,
                highlights: document.getElementById("highlights").value,
                hue_shift: document.getElementById("hue-shift").value,
                colorize: colorize ? 1 : 0,
                invert: invert ? 1 : 0
            };
        }

        function updateProcessedMosaic() {
            if (!lastCapture) return;
            const requestToken = ++processedMosaicRequestToken;
            const params = getSliderValues();
            const query = new URLSearchParams(params).toString();
            const url = `/processed_mosaic/${lastCapture.folder}/${lastCapture.filename}?${query}&t=${Date.now()}`;
            const preview = document.getElementById("captured-mosaic");
            const image = new Image();
            image.onload = function() {
                if (requestToken !== processedMosaicRequestToken) return;
                preview.src = url;
            };
            image.onerror = function() {
                if (requestToken !== processedMosaicRequestToken) return;
                console.warn("[effects] failed to load processed mosaic", url);
            };
            image.src = url;
        }

        function updateColorizeButton() {
            const btn = document.getElementById("colorize-btn");
            btn.textContent = "Colorize: " + (colorize ? "On" : "Off");
            btn.classList.toggle("btn-warning", !colorize);
            btn.classList.toggle("btn-success", colorize);
        }

        function updateInvertButton() {
            const btn = document.getElementById("invert-btn");
            btn.textContent = "Invert: " + (invert ? "On" : "Off");
            btn.classList.toggle("btn-outline-light", !invert);
            btn.classList.toggle("btn-light", invert);
        }

        document.getElementById("colorize-btn").onclick = function() {
            colorize = !colorize;
            updateColorizeButton();
            updateProcessedMosaic();
        };

        function sendMatrixEffectParams() {
            fetch("/set_matrix_effect_params", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    brightness: document.getElementById("brightness").value,
                    contrast: document.getElementById("contrast").value,
                    saturation: document.getElementById("saturation").value,
                    highlights: document.getElementById("highlights").value,
                    hue_shift: document.getElementById("hue-shift").value,
                    colorize: colorize ? 1 : 0,
                    invert: invert ? 1 : 0,
                    generation: lastCapture ? lastCapture.generation : null
                })
            });
        }

        ["brightness", "contrast", "saturation", "highlights", "hue-shift"].forEach(id => {
            document.getElementById(id).addEventListener("change", function() {
                updateProcessedMosaic();
                sendMatrixEffectParams();
            });
        });

        document.getElementById("colorize-btn").onclick = function() {
            colorize = !colorize;
            updateColorizeButton();
            updateProcessedMosaic();
            sendMatrixEffectParams();
        };

        document.getElementById("invert-btn").onclick = function() {
            invert = !invert;
            updateInvertButton();
            updateProcessedMosaic();
            sendMatrixEffectParams();
        };

        document.getElementById("save-final-btn").onclick = function() {
            if (!lastCapture) return;
            const params = getSliderValues();
            fetch("/save_final_image", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    folder: lastCapture.folder,
                    filename: lastCapture.filename,
                    params: params
                })
            })
            .then(res => res.json())
            .then(data => {
                // console.log(data); // <-- Add this line for debugging
                if (data.success) {
                    alert("Image saved and uploaded successfully!");
                } else {
                    alert("Error: " + data.error);
                }
                effectModal.hide(); // Always close the modal
            })
            .catch(err => {
                alert("Network or server error: " + err);
                effectModal.hide();
            });
        };
    });
    </script>
    <script>
    document.getElementById('effectModal').addEventListener('hidden.bs.modal', function () {
        fetch("/matrix_live");
    });
    </script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
